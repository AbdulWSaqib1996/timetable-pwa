r(--tj-bg);padding:4px;border-radius:10px}#tt-journeys .tj-tabs button{border:0;background:none;padding:10px 6px;flex:1;border-radius:7px;min-height:44px;font-size:13px}#tt-journeys .tj-body{padding:14px;display:flex;flex-direction:column;gap:11px;flex:1}#tt-journeys .tj-focus{background:var(--tj-soft);padding:15px;border-radius:13px;display:flex;flex-direction:column;gap:6px}#tt-journeys .tj-focus strong{font-size:26px;line-height:1.25;color:var(--tj-accent)}#tt-journeys .tj-focus small{color:var(--tj-text)}#tt-journeys .tj-tag{color:var(--tj-accent);font-size:12px}#tt-journeys .tj-place{display:flex;flex-direction:column;gap:5px;padding:12px 13px;background:var(--tj-panel);border:1px solid var(--tj-line);border-radius:12px}#tt-journeys .tj-map{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--tj-line);background:var(--tj-panel)}#tt-journeys .tj-map img{display:block;width:100%;height:164px;object-fit:cover}#tt-journeys .tj-map figcaption{padding:8px 10px;font-size:12px;color:var(--tj-muted);background:var(--tj-panel)}#tt-journeys figure{margin:0}#tt-journeys .tj-route{background:var(--tj-panel);border:1px solid var(--tj-line);border-radius:12px;padding:12px}#tt-journeys .tj-route summary{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px;cursor:pointer;font-weight:500}#tt-journeys .tj-legs{list-style:none;padding:10px 0 0;margin:0;display:flex;flex-direction:column;gap:13px}#tt-journeys .tj-legs li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;font-size:13px}#tt-journeys .tj-legs small{display:block;margin-top:3px}#tt-journeys .tj-action{display:flex;align-items:center;justify-content:center;gap:9px;min-height:46px;background:var(--tj-accent);color:var(--tj-on);border:0;border-radius:10px;text-decoration:none;padding:11px 12px;width:100%}#tt-journeys .tj-link{background:none;border:0;text-align:left;color:var(--tj-accent);min-height:44px;padding:0;display:flex;align-items:center;gap:8px}#tt-journeys .tj-foot{padding:12px 16px 16px;background:var(--tj-panel);border-top:1px solid var(--tj-line);display:flex;flex-direction:column;gap:8px}#tt-journeys .tj-foot small{text-align:center}#tt-journeys .tj-nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--tj-panel);border-top:1px solid var(--tj-line);padding:10px 4px;gap:3px}#tt-journeys .tj-nav button,#tt-journeys .tj-nav span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 1px;font-size:11px;min-height:48px;background:none;border:0;border-radius:8px;color:var(--tj-muted)}#tt-journeys .tj-nav .active{color:var(--tj-accent);background:var(--tj-soft)}#tt-journeys .tj-note{color:var(--tj-muted);font-size:12px}#tt-journeys .tj-complete{color:var(--tj-green);display:flex;align-items:center;gap:6px}#tt-journeys .tj-homecard{padding:17px;border-radius:14px;background:var(--tj-soft);display:flex;flex-direction:column;gap:13px}#tt-journeys .tj-homecard h3{font-size:22px}#tt-journeys .tj-session{padding:11px;background:var(--tj-panel);border:1px solid var(--tj-line);border-left:3px solid var(--tj-accent);border-radius:11px;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}#tt-journeys .tj-session span{font-size:12px;color:var(--tj-muted)}#tt-journeys .tj-room{color:var(--tj-accent)!important}#tt-journeys .tj-schedule-head{display:flex;flex-direction:column;gap:13px}#tt-journeys .tj-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}#tt-journeys .tj-days button{display:flex;flex-direction:column;gap:4px;align-items:center;background:none;border:1px solid transparent;border-radius:9px;padding:9px 0;min-height:62px;font-size:12px}#tt-journeys .tj-days b{font-size:16px;font-weight:500}#tt-journeys .tj-dots{height:3px;width:3px;border-radius:50%;background:var(--tj-muted)}#tt-journeys .tj-gaps{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tj-muted);padding-left:12px}#tt-journeys .tj-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}#tt-journeys .tj-calendar button{padding:7px 0;border:0;background:none;min-height:40px;border-radius:7px;font-size:12px}#tt-journeys .tj-calendar span{text-align:center;font-size:11px;padding:4px 0;color:var(--tj-muted)}#tt-journeys .tj-empty{padding:22px 12px;text-align:center;border:1px dashed var(--tj-line);border-radius:12px;color:var(--tj-muted)}#tt-journeys .tj-changed{border:1px solid var(--tj-line);background:var(--tj-panel);border-radius:9px;padding:10px;font-size:12px}#tt-journeys .tj-route-block{display:flex;flex-direction:column;gap:14px}#tt-journeys .tj-route-block.map-first .tj-map{order:-1}#tt-journeys .tj-small-summary{display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--tj-accent);font-size:12px}#tt-journeys .tj-week-label{font-weight:500;font-size:14px}#tt-journeys .tj-filter{border:0;background:none;color:var(--tj-accent);min-height:44px;padding:0 6px}#tt-journeys .tj-origin{display:grid;grid-template-columns:20px 1fr 20px;align-items:center;gap:6px;padding:11px;border:1px solid var(--tj-line);border-radius:10px;background:var(--tj-panel);text-align:left;min-height:44px;font-size:13px}
@media(max-width:590px){#tt-journeys .tj-compare{grid-template-columns:1fr;gap:22px}#tt-journeys .tj-phone{min-height:790px}#tt-journeys .tj-before{max-width:390px;margin:auto}}
@media(max-width:340px){#tt-journeys .tj-days{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
<script>
(()=>{
const root=document.getElementById('tt-journeys'), phone=root.querySelector('#tj-phone');
const assets=JSON.parse(root.querySelector('#tj-assets').textContent);
const state={screen:'session',stage:'entry',sessionTab:'travel',day:7,mode:'week',week:0,mapFirst:true,buffer:10,origin:'Current location'};
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const nav=active=>`<nav class="tj-nav" aria-label="Main navigation"><button type="button" data-go="home" class="${active==='today'?'active':''}">${icon('sun')}Today</button><button type="button" data-go="schedule" class="${active==='schedule'?'active':''}">${icon('calendar-days')}Schedule</button><span>${icon('list-checks')}Tasks</span><span>${icon('graduation-cap')}PGCE file</span></nav>`;
const map=home=>`<figure class="tj-map"><img src="${assets[home?'map-home':'map-campus']}" alt="OpenStreetMap destination area: ${home?'example home near Camden Town':'IOE, 20 Bedford Way'}"><figcaption>${home?'Example home · Camden Town':'Destination · IOE, 20 Bedford Way'} · © OpenStreetMap</figcaption></figure>`;
const route=home=>`<details class="tj-route"><summary><span>Journey steps<small class="tj-sub">Walk · Northern line · Walk</small></span><span class="tj-small-summary">24 min ${icon('chevron-down')}</span></summary><ol class="tj-legs"><li>${icon('footprints')}<div>Walk to ${home?'Euston':'Camden Town'}<small>${home?'From your current location':'From example home'}</small></div><span>8 min</span></li><li>${icon('train-front')}<div>Northern line<small>${home?'Euston → Camden Town':'Camden Town → Euston'}</small></div><span>8 min</span></li><li>${icon('footprints')}<div>Walk to ${home?'home':'Bedford Way'}<small>${home?'Example destination':'Room A5.03 · inside IOE'}</small></div><span>8 min</span></li></ol></details>`;
const blocks=home=>`<div class="tj-route-block ${state.mapFirst?'map-first':''}">${route(home)}${map(home)}</div>`;
const directions=home=>`<footer class="tj-foot"><a class="tj-action" href="https://www.google.com/maps/dir/?api=1&destination=${home?'51.5392%2C-0.1426':'51.5227%2C-0.1276'}&travelmode=transit" target="_blank" rel="noopener noreferrer">${icon('navigation')}Open in Google Maps ${icon('external-link')}</a><small>Opens navigation outside My Timetable</small></footer>`;
function session(){
const leave=60*9-24-state.buffer, fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
return `<header class="tj-top"><button type="button" class="tj-back" data-go="schedule">${icon('chevron-left')}Schedule</button><h2>PS1 · Professionalism</h2><span class="tj-sub">Mon 7 Sep · 09:00–11:00 · Room A5.03</span><div class="tj-tabs"><button type="button" data-detail="overview" aria-pressed="${state.sessionTab==='overview'}">Overview</button><button type="button" data-detail="travel" aria-pressed="${state.sessionTab==='travel'}">Travel & map</button></div></header>${state.sessionTab==='travel'?`<main class="tj-body"><div class="tj-focus"><span>Arrive ready for your 09:00 session</span><strong>Leave by ${fmt(leave)}</strong><small>24 min journey + ${state.buffer} min arrival buffer</small><span class="tj-note">Planned arrival ${fmt(540-state.buffer)} · sample journey</span></div><div class="tj-place"><strong>IOE · 20 Bedford Way</strong><span class="tj-note">Room A5.03 · Bloomsbury · London</span></div>${blocks(false)}<span class="tj-note">Illustrative route · no live departure prediction</span></main>${directions(false)}`:`<main class="tj-body"><h3>Exploring Professionalism</h3><p>Introduction to PS and Teacher Identity</p><div class="tj-place"><strong>Monday 7 September</strong><span>09:00–11:00 · Tutor LD</span><span>IOE · Room A5.03</span></div><button type="button" class="tj-action" data-detail="travel">${icon('route')}Plan your journey</button><p class="tj-note">Session notes and evidence stay in Overview.</p></main>`}`;
}
function home(){return state.stage==='entry'?`<header class="tj-top"><div class="tj-row"><h2>Today</h2><span class="tj-tag">Mon 7 September</span></div><span class="tj-sub">16:35 · all three sessions finished</span></header><main class="tj-body"><div class="tj-complete">${icon('circle-check')}Your teaching day is finished</div><div class="tj-homecard"><div class="tj-row"><h3>Ready to head home?</h3>${icon('house')}</div><span>From IOE · Bedford Way</span><div class="tj-row"><strong>24 min by public transport</strong><span>16:59 ETA</span></div><small>Example home · Camden Town</small><button type="button" class="tj-action" data-stage="route">${icon('route')}View journey home</button><small>Sample journey · saved home location</small></div><h3>Today’s sessions</h3><div class="tj-session"><span>14:30–16:30 · finished</span><strong>Maths 1</strong><span>Bedford Way · Room 731</span></div><div class="tj-session"><span>11:30–13:30 · finished</span><strong>English 1</strong><span>Bedford Way · Room 421</span></div><h3>Tomorrow</h3><div class="tj-session"><span>09:00–11:00</span><strong>PS2 · Aims and values</strong><span class="tj-room">Bedford Way · Room 642</span></div></main>${nav('today')}`:`<header class="tj-top"><button type="button" class="tj-back" data-stage="entry">${icon('chevron-left')}Today</button><h2>Journey home</h2><span class="tj-sub">Example home · near Camden Town</span></header><main class="tj-body"><div class="tj-focus"><span>Leaving now · 16:35</span><strong>Home around 16:59</strong><small>24 min by public transport · sample journey</small></div><button type="button" class="tj-origin" data-origin="toggle">${icon('locate-fixed')} <span>From: ${state.origin}</span> ${icon('chevron-down')}</button>${blocks(true)}<span class="tj-note">Illustrative route · no live departure prediction</span></main>${directions(true)}`;}
const sessions={7:[['09:00–11:00','PS1 · Professionalism','A5.03'],['11:30–13:30','English 1','421 · Nunn Hall'],['14:30–16:30','Maths 1','731']],8:[['09:00–11:00','PS2 · Aims and values','642'],['11:30–13:30','Self study',''],['14:30–16:30','EYFS Pathway 1','642']],9:[['09:00–11:00','PSHE 1','631'],['11:30–13:30','Science 1','731'],['14:30–16:30','Maths · Number (optional)','631']],10:[['09:00–11:00','Specialism choices','Multiple rooms'],['11:30–13:30','Specialism · Science','780']],11:[['10:00–11:00','L&T 1','Cruciform B.3.04'],['11:30–13:30','L&T 1','305 · Clarke Hall']],14:[['09:00–11:00','Maths 2','728'],['11:30–13:30','Music 1','944']]};
const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function schedule(){
const start=7+state.week*7, date=new Date(2026,8,state.day), list=sessions[state.day]||[],label=date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
const days=Array.from({length:7},(_,i)=>`<button type="button" data-day="${start+i}" aria-label="${new Date(2026,8,start+i).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long'})}" aria-pressed="${state.day===start+i}"><span>${dayNames[i]}</span><b>${new Date(2026,8,start+i).getDate()}</b>${sessions[start+i]?'<span class="tj-dots"></span>':'<span style="height:3px"></span>'}</button>`).join('');
const calendar=dayNames.map(d=>`<span>${d}</span>`).join('')+'<span></span>'+Array.from({length:30},(_,i)=>`<button type="button" data-day="${i+1}" aria-label="${i+1} September" aria-pressed="${state.day===i+1}">${i+1}</button>`).join('');
return `<header class="tj-top"><div class="tj-row"><h2>Schedule</h2><button type="button" class="tj-filter" data-today="true">Today</button></div><span class="tj-sub">Primary PGCE · sample timetable</span><div class="tj-tabs"><button type="button" data-mode="week" aria-pressed="${state.mode==='week'}">Week</button><button type="button" data-mode="month" aria-pressed="${state.mode==='month'}">Month</button></div></header><main class="tj-body"><div class="tj-schedule-head"><div class="tj-row">${state.mode==='week'?`<button type="button" class="tj-icon" data-week="-1" aria-label="Previous week">${icon('chevron-left')}</button><span class="tj-week-label">${new Date(2026,8,start).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}–${new Date(2026,8,start+6).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span><button type="button" class="tj-icon" data-week="1" aria-label="Next week">${icon('chevron-right')}</button>`:'<strong>September 2026</strong>'}</div><div class="${state.mode==='week'?'tj-days':'tj-calendar'}">${state.mode==='week'?days:calendar}</div></div><div class="tj-row"><h3>${label}</h3><span class="tj-tag">${list.length} sessions</span></div>${list.length?list.map((s,i)=>`<button type="button" class="tj-session" data-open-session="${i}"><span>${s[0]}</span><strong>${s[1]}</strong><span class="tj-room">${s[2]?`Room ${s[2]}`:'Independent study'}</span>${s[2]?`<span>${s[2].includes('Cruciform')?'Cruciform':'Bedford Way'} · tap for details</span>`:''}</button>${i===0&&state.day<10?`<div class="tj-gaps">${icon('coffee')}30 min break</div>`:''}${i===1&&state.day<10?`<div class="tj-gaps">${icon('utensils')}1 hour for lunch</div>`:''}`).join(''):'<div class="tj-empty">No sessions in this sample timetable</div>'}<small>Dots show days with sessions.</small></main>${nav('schedule')}`;
}
function render(){
root.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===state.screen)));
root.querySelector('.tj-stage').hidden=state.screen!=='home';
root.querySelectorAll('.tj-stage button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.stage===state.stage)));
const key=state.screen==='session'?'before-session-travel':state.screen==='schedule'?'before-mobile-schedule':`before-home-${state.stage}`;
const img=root.querySelector('#tj-before');img.src=assets[key];img.alt=`Actual current UI: ${state.screen==='session'?'session travel and destination map':state.screen==='schedule'?'mobile Week view':state.stage==='entry'?'home journey header shortcut':'home journey popover'}. Synthetic journey data.`;
root.querySelector('#tj-before-label').textContent=state.screen==='session'?'Travel section in the long detail sheet':state.screen==='schedule'?'Week view · days stacked in one long list':state.stage==='entry'?'Small home shortcut in the top bar':'Home popover · slightly clipped at left';
root.querySelector('#tj-after-label').textContent=state.screen==='session'?'Leave time, room, route and map together':state.screen==='schedule'?'Tap a day · see its schedule':state.stage==='entry'?'A visible journey card on Today':'A full-width view with a clear navigation action';
phone.innerHTML=state.screen==='session'?session():state.screen==='home'?home():schedule();
if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
if(b.dataset.screen){state.screen=b.dataset.screen;state.stage='entry';}
if(b.dataset.stage)state.stage=b.dataset.stage;
if(b.dataset.go){state.screen=b.dataset.go;state.stage='entry';}
if(b.dataset.detail)state.sessionTab=b.dataset.detail;
if(b.dataset.mode)state.mode=b.dataset.mode;
if(b.dataset.day){state.day=Number(b.dataset.day);state.week=Math.floor((state.day-7)/7);}
if(b.dataset.week){state.week=Math.max(-1,Math.min(2,state.week+Number(b.dataset.week)));state.day=7+state.week*7;}
if(b.dataset.today){state.day=7;state.week=0;}
if(b.dataset.origin)state.origin=state.origin==='Current location'?'IOE · Bedford Way':'Current location';
if(b.dataset.openSession!==undefined){if(state.day===7&&b.dataset.openSession==='0'){state.screen='session';state.sessionTab='overview';}else{b.querySelector('strong').after(Object.assign(document.createElement('small'),{textContent:'Concept preview: the PS1 session on Monday has the travel walkthrough.'}));b.disabled=true;return;}}
render();
});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:render});tweak.addToggle(state,'mapFirst',{label:'Show map before journey steps'});tweak.addSlider(state,'buffer',{label:'Arrival buffer',min:0,max:20,step:5,unit:'min'});}
})();
</script>
