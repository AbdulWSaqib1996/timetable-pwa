<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timetable admin • design prototype</title><style>
:root{--bg:#f5f6fa;--surface:#fff;--text:#202940;--muted:#5b667b;--accent:#3e51c7;--soft:#eef0ff;--border:#dfe4ed;--success:#196c54;--danger:#9f1d1d;--danger-soft:#fdecea;--on:#fff}html[data-theme=dark]{--bg:#111722;--surface:#1a2230;--text:#e9edf6;--muted:#adb7cb;--accent:#b1bcff;--soft:#2a3557;--border:#354154;--success:#99ddc6;--danger:#f3b8b8;--danger-soft:#3a1f1f;--on:#172041}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit;color:inherit}button,select{border:1px solid var(--border);border-radius:10px;background:var(--surface);min-height:44px;padding:9px 14px;cursor:pointer}button:hover{background:var(--soft)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent)}.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:12px;z-index:10;background:var(--surface);padding:12px}.rail{position:fixed;inset:0 auto 0 0;width:224px;background:var(--surface);border-right:1px solid var(--border);padding:28px 16px;display:flex;flex-direction:column;gap:24px}.brand{font-weight:750;font-size:17px;display:flex;align-items:center;gap:10px}.logo{background:var(--accent);color:var(--on);padding:6px 11px;border-radius:10px;font-size:20px}.eyebrow{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}nav{display:grid;gap:6px}nav button{text-align:left;border-color:transparent;background:transparent;display:flex;gap:12px;align-items:center}nav button[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:650}.nav-icon{width:20px;text-align:center}.rail-foot{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--muted)}.prototype{background:var(--soft);color:var(--accent);padding:10px 12px;border-radius:10px;font-size:12px}.wrap{margin-left:224px;padding:28px 32px 64px;max-width:1536px}.mast{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.crumb{color:var(--muted);font-size:13px}.tools{display:flex;gap:8px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:30px;line-height:1.2;margin:0 0 8px;letter-spacing:-.6px}h2{font-size:18px;margin:0 0 4px;letter-spacing:-.2px}h3{font-size:15px;margin:0 0 8px}p{margin:0 0 12px}.muted,.sub{color:var(--muted)}.sub{font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent)}.status{font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:20px}.status i{height:8px;width:8px;border-radius:50%;background:var(--success)}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:20px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:0}.metric-label{font-size:13px;color:var(--muted);font-weight:550}.value{font-size:34px;font-weight:720;line-height:1.2;margin:10px 0 6px;letter-spacing:-1px}.value small{font-size:15px;letter-spacing:0;font-weight:450;color:var(--muted)}.split{grid-template-columns:minmax(0,1.8fr) minmax(270px,1fr);margin-bottom:20px}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.card-head button{font-size:13px}.chart{height:210px;display:flex;gap:12px;margin:18px 0 0}.yaxis{display:flex;flex-direction:column;justify-content:space-between;width:24px;color:var(--muted);font-size:11px;padding-bottom:24px}.plot{position:relative;flex:1;display:flex;align-items:flex-end;gap:5px;padding-bottom:24px;border-bottom:1px solid var(--border);background:repeating-linear-gradient(to top,transparent 0,transparent 45px,var(--border) 46px,transparent 47px)}.plot button{position:relative;flex:1;padding:0;min-height:0;height:var(--h);background:var(--accent);border:0;border-radius:3px 3px 0 0;max-width:36px}.plot button:hover{opacity:.65}.plot button span{position:absolute;bottom:0;left:0;width:100%;height:var(--new);background:var(--success)}.dates{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-left:36px;margin-top:8px}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:16px}.dot{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:2px;margin-right:6px}.dot.green{background:var(--success)}.notice{padding:14px 16px;background:var(--soft);border:1px solid var(--border);border-radius:10px;font-size:13px;margin-bottom:20px}.notice.warn{background:var(--danger-soft);color:var(--danger)}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.row strong{font-size:14px}.progress{height:7px;background:var(--bg);border-radius:4px;margin:8px 0 4px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);border-radius:4px}.inline{border:0;background:transparent;padding:0;min-height:44px;color:var(--accent);font-weight:600;text-align:left}.bottom{grid-template-columns:1fr 1fr}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}caption{text-align:left;font-size:13px;color:var(--muted);padding-bottom:12px}th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;background:var(--bg)}td,th{padding:14px 12px;border-bottom:1px solid var(--border);vertical-align:top}td small{display:block;font-size:12px;color:var(--muted)}.num{text-align:right;font-variant-numeric:tabular-nums}.pill{color:var(--success);font-size:12px}.empty{padding:24px;border:1px dashed var(--border);border-radius:10px;margin-top:14px;color:var(--muted)}.cohort td:not(:first-child){text-align:center;background:var(--soft);color:var(--accent);font-weight:650;border:4px solid var(--surface)}.cohort td.pending{background:var(--bg);color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.step{padding:16px;background:var(--bg);border-radius:10px}.step strong{display:block;font-size:24px}.mobile-select{display:none}#toast{position:fixed;bottom:20px;right:20px;max-width:calc(100% - 40px);background:var(--text);color:var(--surface);padding:12px 18px;border-radius:10px;z-index:5}#toast:empty{display:none}.auth{max-width:440px;margin:50px auto}.auth label{display:block;font-weight:600;margin:20px 0 8px}.auth input{display:block;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:44px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}.primary:hover{filter:brightness(.94);background:var(--accent)}.definition{margin-top:16px;color:var(--muted);font-size:12px}.switches{display:flex;gap:8px;flex-wrap:wrap}.state-options{margin-top:28px;border-top:1px solid var(--border);padding-top:16px}.state-options label{font-size:12px;color:var(--muted)}
@media(min-width:1500px){.wrap{margin-right:auto}}@media(max-width:1100px){.rail{width:192px}.wrap{margin-left:192px;padding:24px}.split{grid-template-columns:1fr}.bottom{grid-template-columns:1fr 1fr}}@media(max-width:767px){.rail{position:static;width:auto;padding:16px;border-right:0;border-bottom:1px solid var(--border);gap:12px}.rail nav,.rail-foot{display:none}.brand{font-size:16px}.mobile-select{display:block;width:100%}.wrap{margin:0;padding:20px 16px 36px}.mast{margin-bottom:20px}.crumb{font-size:12px}.tools button{padding:8px 12px}.heading{display:block}h1{font-size:26px}.heading select{margin-top:12px;width:100%}.kpis{grid-template-columns:1fr;gap:12px}.kpis .card{padding:16px;display:grid;grid-template-columns:1fr auto;column-gap:10px}.value{grid-column:2;grid-row:1/3;font-size:30px;margin:0;align-self:center}.metric-label{align-self:end}.kpis .sub{margin-top:4px}.status{align-items:flex-start;font-size:12px;gap:8px}.status i{flex-shrink:0;margin-top:5px}.card{padding:16px}.bottom,.steps{grid-template-columns:1fr}.chart{height:180px}.plot{gap:3px}.card-head{gap:8px}.card-head button{padding:8px}.table-wrap{margin:0 -4px}.card-head .badge{white-space:nowrap}.desktop-only{display:none}.auth{margin:20px auto}td,th{padding:12px 8px}.feature-table thead{display:none}.feature-table tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);padding:12px 0}.feature-table td{border:0;padding:4px 0}.feature-table td:first-child{grid-column:1/-1;font-weight:650}.feature-table td::before{content:attr(data-label);display:block;color:var(--muted);font-size:11px;font-weight:450}.feature-table .num{text-align:left}}
</style></head><body><a href="#main" class="skip">Skip to content</a><aside class="rail"><div class="brand"><span class="logo">▦</span> My Timetable</div><div class="eyebrow desktop-only">Admin workspace</div><nav aria-label="Admin sections" id="nav"></nav><select aria-label="Admin section" class="mobile-select" id="mobileNav"></select><div class="rail-foot"><div class="prototype">Design prototype<br>Synthetic data only</div><span>Private owner dashboard</span><span>No student records shown</span></div></aside><div class="wrap"><header class="mast"><div class="crumb">Admin / <span id="crumb">Overview</span></div><div class="tools"><button id="theme" aria-label="Toggle colour theme">Dark</button><button id="lock">Lock</button></div></header><main id="main" tabindex="-1"></main><footer class="state-options"><label for="state">Prototype state </label><select id="state"><option value="ready">Ready</option><option value="empty">No data</option><option value="stale">Stale / offline</option><option value="error">Service error</option><option value="limited">Rate limited</option></select><p class="definition">Illustrative design • 7 September 2026 • controls demonstrate behaviour; no live service is connected.</p></footer></div><div id="toast" role="status" aria-live="polite"></div><script>
const pages=[['overview','Overview','▦'],['adoption','Feature adoption','↗'],['returning','Return visits','↻'],['reliability','Reliability','◇'],['releases','Releases','◫'],['access','Data & access','⚙']];let current=new URLSearchParams(location.search).get('page')||'overview';let state='ready';const main=document.querySelector('main');
function notify(s){document.querySelector('#toast').textContent=s;setTimeout(()=>document.querySelector('#toast').textContent='',4500)}
const card=(label,value,sub)=>`<article class="card"><div class="metric-label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></article>`;
const heading=(title,sub,range='1–7 Sep 2026 · UTC')=>`<div class="heading"><div><h1>${title}</h1><p class="muted">${sub}</p></div><select aria-label="Reporting period"><option>${range}</option></select></div>`;
const newNote=`<div class="notice"><strong>New feature concept.</strong> These example values require new instrumentation and complete collection windows. They are not available in the current app.</div>`;
const row=(a,b,s='')=>`<div class="row"><div><strong>${a}</strong><small>${s}</small></div><strong>${b}</strong></div>`;
function chart(){return `<div class="chart"><div class="yaxis"><span>80</span><span>60</span><span>40</span><span>20</span><span>0</span></div><div class="plot">${Array.from({length:31},(_,j)=>{const i=30-j,n=i===0?38:32+(i*7)%36,k=i===0?6:3+i%7;return `<button style="--h:${n/80*100}%;--new:${k/n*100}%" aria-label="${new Date(Date.UTC(2026,8,7-i)).toISOString().slice(0,10)}: ${n} active browser tokens, ${k} new" onclick="notify(this.getAttribute('aria-label'))"><span></span></button>`}).join('')}</div></div><div class="dates"><span>8 Aug</span><span>18 Aug</span><span>28 Aug</span><span>7 Sep*</span></div><div class="legend"><span><i class="dot"></i>Returning tokens</span><span><i class="dot green"></i>New tokens</span><span>* Today is partial</span></div>`}
function overview(){return heading('Overview','Understand usage, then see what needs attention.')+`<div class="status"><i></i><span>Snapshot generated 10:42 UTC · Today is partial · <strong>Synthetic fixture</strong></span><button class="inline" style="margin-left:auto" onclick="notify('Prototype: refresh would request an authenticated snapshot.')">Refresh</button></div><div class="grid kpis">${card('Active browser tokens · 7 days','124','1–7 Sep · includes partial today')}${card('Active today','38','7 Sep · UTC day in progress')}${card('Reported standalone today','24 <small>/ 38</small>','63% of active tokens · not install count')}</div><div class="grid split"><section class="card"><div class="card-head"><div><h2>Daily activity</h2><div class="sub">8 Aug–7 Sep · 31 days · browser tokens</div></div><button onclick="go('daily')">View data</button></div>${chart()}</section><section class="card"><div class="card-head"><h2>Read this snapshot</h2><span class="badge">Context</span></div>${row('208 active tokens','30 days','9 Aug–7 Sep · includes today')}${row('286 first-seen tokens','All time','Browser resets can create new tokens')}${row('Collection coverage','Unknown','Legacy clients do not report eligibility')}<button class="inline" onclick="go('access')">Explore data definitions →</button></section></div><div class="grid bottom"><section class="card"><div class="card-head"><div><h2>Feature adoption</h2><div class="sub">1–7 Sep · legacy coverage unknown</div></div><button onclick="go('adoption')">View all</button></div>${[['Session details',92,74],['Week view',74,60],['Search',48,39]].map(([s,n,p])=>`<div class="row"><div style="flex:1"><strong>${s}</strong><div class="progress"><span style="width:${p}%"></span></div><small>${n} of 124 active tokens · ${p}%</small></div></div>`).join('')}</section><section class="card"><h2>Setup reported today</h2><div class="sub">36 of 38 active tokens sent a setup snapshot</div>${row('Home configured','28 / 36','78% of tokens reporting setup')}${row('Push enabled','24 / 36','67% · does not prove delivery')}${row('Sync configured','17 / 36','47% · does not prove successful sync')}</section></div><p class="definition">A token represents one browser storage identity, not a person. Opens and features in this legacy snapshot may include counters from earlier days.</p>`}
function adoption(){return heading('Feature adoption','See what is measured before interpreting what is used.')+`<div class="notice">Legacy percentages use all 124 active tokens. Eligible-client coverage is unknown. New timetable actions must remain “Not collected” until the tracking contract ships.</div><section class="card"><div class="card-head"><h2>Usage across the timetable</h2><span class="badge">Legacy + planned</span></div><div class="table-wrap"><table class="feature-table"><caption>1–7 September 2026, UTC. Uses are recorded actions, not completed outcomes.</caption><thead><tr><th>Feature / action</th><th class="num">Tokens</th><th class="num">Share</th><th class="num">Uses</th><th>Measurement</th></tr></thead><tbody>${[['Session details','92 / 124','74%','384','Legacy · coverage unknown'],['Week view','74 / 124','60%','212','Legacy · coverage unknown'],['Search','48 / 124','39%','106','Legacy · coverage unknown'],['Photo add attempt','18 / 124','15%','31','Attempt, not saved photo'],['Tasks completed','—','—','—','Not collected'],['Journey home opened','—','—','—','Not collected'],['PGCE evidence saved','—','—','—','Not collected']].map(r=>'<tr>'+r.map((x,i)=>`<td class="${i>0&&i<4?'num':''}" data-label="${['','Tokens','Share','Uses','Measurement'][i]}">${x}</td>`).join('')+'</tr>').join('')}</tbody></table></div></section><div class="grid bottom" style="margin-top:20px"><section class="card"><h2>What changes with tracking v2?</h2><p class="muted">Eligible tokens, explicit successes, collection start dates and consistent event-day buckets.</p><span class="badge">New contract required</span></section><section class="card"><h2>Coverage comes before comparison</h2><p class="muted">An unavailable count stays unavailable. Do not turn a missing event into a 0% adoption bar.</p><button class="inline" onclick="go('releases')">Review release coverage →</button></section></div>`}
function returning(){return heading('Return visits','Separate observed frequency from cohort retention.','Completed weeks · UTC')+newNote+`<div class="grid kpis">${card('First-seen cohort · 10 Aug','40','Example browser tokens')}${card('Returned in week 1','22 <small>/ 40</small>','55% · exact following calendar week')}${card('Returned in week 2','18 <small>/ 40</small>','45% · exact following calendar week')}</div><section class="card"><h2>Weekly return cohorts</h2><p class="sub">Week 0 = first-seen calendar week. A return means at least one observed active day in that later week.</p><div class="table-wrap"><table class="cohort"><caption>Example only. A dash means the observation week has not completed.</caption><thead><tr><th>Cohort starts</th><th>Tokens</th><th>Week 1</th><th>Week 2</th><th>Week 3</th></tr></thead><tbody><tr><td>10 Aug</td><td>40</td><td>55%<small>22 / 40</small></td><td>45%<small>18 / 40</small></td><td>40%<small>16 / 40</small></td></tr><tr><td>17 Aug</td><td>32</td><td>50%<small>16 / 32</small></td><td>44%<small>14 / 32</small></td><td class="pending">—</td></tr><tr><td>24 Aug</td><td>28</td><td>50%<small>14 / 28</small></td><td class="pending">—</td><td class="pending">—</td></tr></tbody></table></div></section><section class="card" style="margin-top:20px"><h2>Legacy return frequency</h2><p class="muted">58 tokens appeared on one day, 88 on 2–4 days and 62 on 5+ days in the 31-day fixture. This does not establish when they first tried the app.</p><span class="badge">Existing data · different definition</span></section>`}
function reliability(){return heading('Reliability','Find collection and service problems without exposing records.')+newNote+`<div class="grid kpis">${card('Telemetry accepted','98.6%','690 / 700 example request attempts')}${card('Aggregate updated','4 min','Example scheduled snapshot age')}${card('Delivery coverage','Unknown','Worker acceptance ≠ device delivery')}</div><div class="grid split"><section class="card"><div class="card-head"><h2>Signals needing review</h2><span class="badge">1 example issue</span></div><div class="notice warn"><strong>Collection rejects increased</strong><br>10 of 700 request attempts rejected this week. Review contract versions before interpreting an adoption change.</div>${row('Invalid schema','7','Counted at the worker · no request bodies retained')}${row('Oversized request','3','Rejected before JSON parse')}${row('Sync outcomes','Not instrumented','No encrypted content, codes or identifiers exposed')}<button class="inline" onclick="notify('Prototype: open aggregated reason-code detail, never raw requests.')">Inspect aggregate reasons →</button></section><section class="card"><h2>Signal sources</h2>${row('Telemetry acceptance','Worker','Reliable for requests reaching this endpoint')}${row('Offline outcomes','Client reports','May arrive late; unsent failures are unobserved')}${row('Background reminders','Not collected','Requires separate worker outcome counters')}</section></div><section class="card"><h2>Collection timeline</h2><div class="steps"><div class="step"><span class="sub">Receive</span><strong>700</strong>request attempts</div><div class="step"><span class="sub">Accept</span><strong>690</strong>valid attempts</div><div class="step"><span class="sub">Report</span><strong>124</strong>distinct tokens</div></div><p class="sub">Requests and tokens have different denominators. Retries can increase request counts.</p></section>`}
function releases(){return heading('Releases','Understand who can report each feature before comparing versions.')+newNote+`<section class="card"><div class="card-head"><div><h2>Reporting coverage</h2><p class="sub">Example build identities · 124 active tokens this week</p></div><span class="badge">Build ID required</span></div>${[['pwa-2026.09.07-a',96,77,'Telemetry v2 · new action coverage'],['pwa-2026.08.31-b',20,16,'Legacy tracking · limited coverage'],['Unknown',8,6,'No build identifier reported']].map(([s,n,p,desc])=>`<div class="row"><div style="flex:1"><strong>${s}</strong><small>${desc}</small><div class="progress"><span style="width:${p}%"></span></div></div><strong>${n} / 124</strong></div>`).join('')}</section><div class="grid bottom" style="margin-top:20px"><section class="card"><h2>Compare on equal terms</h2><p class="muted">Use completed periods, eligible token counts and the same metric contract. Keep small or incompatible groups out of headline deltas.</p><span class="badge">Comparison unavailable</span><p class="definition">New build does not yet have a complete comparison window.</p></section><section class="card"><h2>Legacy release marker</h2><p class="muted">The current app sends its “What’s new” version. That is not a unique deployment identifier.</p><p class="sub">In today's fixture: marker 12 → 30 tokens; marker 11 → 8 tokens.</p></section></div>`}
function access(){return heading('Data & access','Know what is stored, what is missing and when to lock this device.','Snapshot · 7 Sep 10:42 UTC')+`<div class="grid bottom"><section class="card"><h2>Private admin session</h2><p class="muted">Proposed access model: a key held in this tab's memory and sent in an authorization header.</p>${row('Session','Unlocked','Concept only · no key is used by this prototype')}${row('Persistent stats cache','Off','Lock clears the rendered snapshot')}${row('Inactive session','15-minute lock','Client privacy measure; the server key remains valid')}<button class="primary" onclick="go('locked')">Lock dashboard</button></section><section class="card"><h2>Metric definitions</h2>${row('Active browser token','Observed ping','Not a unique person or install')}${row('Standalone report','Launch mode','Does not prove that push works')}${row('Setup coverage','36 / 38','2 active tokens supplied no setup snapshot')}${row('Reporting boundary','UTC','Legacy dayparts use each device’s local clock')}</section></div><section class="card" style="margin-top:20px"><div class="card-head"><div><h2>Collection and retention</h2><p class="sub">Current policy and required changes must remain visible.</p></div><button onclick="notify('Prototype: export aggregate rows with definitions and UTC timestamps, never token IDs.')">Export aggregates</button></div>${row('Daily ping rows','90 days','Current expiry; first-seen token ledger currently has no expiry')}${row('Opt-out behaviour','Fix required','Gate collection as well as transmission; discard pending counters')}${row('Student content','Excluded','No names, sheets, locations, photos, notes or sync codes in telemetry')}<div class="notice" style="margin-top:16px">New controls: aggregate CSV export, measurement glossary, collection start dates and incomplete-data warnings. No raw device browser or remote content editor.</div></section>`}
function daily(){return heading('Daily activity data','Accessible values behind the chart.','8 Aug–7 Sep · UTC')+`<button onclick="go('overview')">← Overview</button><section class="card" style="margin-top:16px"><div class="table-wrap"><table><caption>Last 7 rows of the synthetic fixture. Today is partial.</caption><thead><tr><th>Date</th><th>Active</th><th>New</th><th>Returning</th></tr></thead><tbody>${Array.from({length:7},(_,i)=>{let n=i?32+(i*7)%36:38,k=i?3+i%7:6;return `<tr><td>${7-i} Sep${i===0?' · partial':''}</td><td>${n}</td><td>${k}</td><td>${n-k}</td></tr>`}).join('')}</tbody></table></div></section>`}
function locked(){return `<section class="card auth"><span class="badge">Private admin dashboard</span><h1 style="margin-top:20px">Unlock analytics</h1><p class="muted">Use your owner key to view aggregated timetable usage.</p><form onsubmit="event.preventDefault();go('overview');notify('Prototype unlocked. No credential was sent or stored.')"><label for="key">Owner key</label><input id="key" type="password" autocomplete="off" placeholder="Synthetic prototype — any value" required><p class="definition">In the proposed implementation, the key is sent securely to the worker and held only in this tab's memory.</p><button class="primary" style="width:100%;margin-top:16px">Unlock dashboard</button></form></section>`}
function go(p){current=p;state='ready';document.querySelector('#state').value='ready';render();window.scrollTo(0,0)}
function render(){document.querySelector('#nav').innerHTML=pages.map(([p,n,i])=>`<button onclick="go('${p}')" ${p===current?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${i}</span>${n}</button>`).join('');document.querySelector('#mobileNav').innerHTML=pages.map(([p,n])=>`<option value="${p}" ${p===current?'selected':''}>${n}</option>`).join('');document.querySelector('#crumb').textContent=pages.find(p=>p[0]===current)?.[1]||'Overview';main.innerHTML=({overview,adoption,returning,reliability,releases,access,daily,locked}[current]||overview)();if(state==='empty')main.innerHTML=heading('No observations yet','A successful empty response is different from a service error.')+'<section class="card"><h2>No activity in this period</h2><p class="muted">Metrics are unavailable until the first valid snapshot arrives. No percentages are calculated from zero observations.</p><button onclick="go(\'access\')">Read collection definitions</button></section>';if(state==='stale')main.insertAdjacentHTML('afterbegin','<div class="notice warn"><strong>Offline — showing an earlier snapshot</strong><br>Generated 7 Sep, 10:42 UTC. Current activity is unknown. A refresh must recheck authorization before replacing it.</div>');if(state==='error'||state==='limited')main.innerHTML=heading(state==='limited'?'Please wait before refreshing':'Analytics is temporarily unavailable','Your timetable data is unaffected.')+`<section class="card"><p>${state==='limited'?'Too many requests. Retry after the server-provided delay.':'The worker did not return a complete snapshot. No partial counts are shown as totals.'}</p><button onclick="go('overview')">${state==='limited'?'Simulate delay elapsed':'Retry'}</button></section>`;}
document.querySelector('#mobileNav').onchange=e=>go(e.target.value);document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#theme').textContent=dark?'Light':'Dark'};document.querySelector('#lock').onclick=()=>go('locked');document.querySelector('#state').onchange=e=>{state=e.target.value;render()};if(new URLSearchParams(location.search).get('theme')==='dark'){document.documentElement.dataset.theme='dark';document.querySelector('#theme').textContent='Light'}render();
</script></body></html>
