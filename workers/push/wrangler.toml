name = "timetable-push"
main = "worker.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "PUSH"
id = "f4bb2f63ca3a4a76975036c421791731"

[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncStore"

[[migrations]]
tag = "sync-v2"
new_sqlite_classes = ["SyncStore"]

[[durable_objects.bindings]]
name = "GROUPS"
class_name = "GroupStore"

[[migrations]]
tag = "groups-v1"
new_sqlite_classes = ["GroupStore"]

[[durable_objects.bindings]]
name = "ANALYTICS"
class_name = "AnalyticsStore"

[[migrations]]
tag = "analytics-v1"
new_sqlite_classes = ["AnalyticsStore"]

[[durable_objects.bindings]]
name = "MENTORS"
class_name = "MentorStore"

[[migrations]]
tag = "mentor-v1"
new_sqlite_classes = ["MentorStore"]
